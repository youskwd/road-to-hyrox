<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#14181f;--sub:#667085;--ac:#e8590c;--bd:#e3e6ea;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#1a2029;--tx:#f1f3f6;--sub:#98a2b3;--ac:#ff8a3d;--bd:#2a323d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#1a2029;--tx:#f1f3f6;--sub:#98a2b3;--ac:#ff8a3d;--bd:#2a323d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;max-width:560px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:15px;margin:0 0 4px;color:var(--sub);font-weight:600}
.big{font-size:72px;font-weight:800;color:var(--ac);line-height:1}
.big small{font-size:20px;margin-left:6px;color:var(--tx)}
.sub{color:var(--sub);font-size:13px;margin-top:8px}
.bar{height:8px;background:var(--bd);border-radius:4px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
select,textarea,input{width:100%;padding:10px;margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
.go{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;font-weight:700}
.item{border-top:1px solid var(--bd);padding:10px 0;font-size:14px}
.item:first-child{border-top:0}
.meta{color:var(--sub);font-size:12px;margin-bottom:3px}
.item pre{white-space:pre-wrap;word-break:break-word;margin:0;font:inherit}
.item a{color:var(--ac);word-break:break-all}
.del{background:none;border:0;color:var(--sub);font-size:12px;padding:0;margin-left:8px}
.note{font-size:12px;color:var(--sub);margin:0 0 10px}
[hidden]{display:none!important}

.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1c1f26 0%,#3a1d0b 60%,#e8590c 130%);border:0;color:#fff}
.hero h1,.hero .sub{color:rgba(255,255,255,.8)}
.hero h1{font-size:24px;line-height:1.15;letter-spacing:.14em;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);margin:0 0 6px}
.hero .tag{font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.75);margin-bottom:12px}
.hero .big small{color:#fff}
.hero .bar{background:rgba(255,255,255,.2)}
.hero .bar i{background:linear-gradient(90deg,#ffb347,#ff6a1a)}
.hero .art{position:absolute;right:-8px;bottom:-6px;width:58%;opacity:.9;pointer-events:none}
.hero>*:not(.art){position:relative}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-size:24px;color:var(--ac)}
.stat span{font-size:11px;color:var(--sub)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;color:var(--sub);text-align:center;margin-bottom:4px}
.cell{aspect-ratio:1;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub)}
.cell.on{background:var(--ac);font-size:20px;transform:rotate(-6deg);box-shadow:0 2px 6px rgba(232,89,12,.4)}
.cell.today{outline:2px solid var(--ac)}
.cell.fut{opacity:.4}
.badges{display:flex;gap:8px;margin-top:14px;overflow-x:auto}
.bd{flex:0 0 auto;width:64px;text-align:center;font-size:10px;color:var(--sub)}
.bd i{display:block;font-style:normal;font-size:30px}
.bd.lock{filter:grayscale(1);opacity:.35}
.msg{font-size:13px;margin:10px 0 0;text-align:center;font-weight:600}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--ac);color:#fff;padding:18px 28px;border-radius:20px;font-size:22px;font-weight:800;z-index:50;animation:pop 1.8s ease forwards;pointer-events:none}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.cf{position:fixed;top:-30px;font-size:26px;z-index:49;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.8}}
</style>

<script>
const TARGET=new Date(2027,2,13), START=new Date(2026,9,16);
function tick(){
  const n=new Date(), t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const d=Math.max(0,Math.round((TARGET-t0)/864e5));
  document.getElementById('days').textContent=d;
  document.getElementById('detail').textContent='あと約'+Math.floor(d/7)+'週間'+(d%7)+'日';
  const p=Math.min(100,Math.max(0,(t0-START)/(TARGET-START)*100));
  document.getElementById('prog').style.width=p+'%';
}
tick();setInterval(tick,6e4);

const CATS={train:['筋トレ','ラン','SkiErg/ロウ','そり・キャリー・ランジ','ウォールボール','その他'],meal:['朝食','昼食','夕食','間食','タンパク質(g)']};
const HINT={train:'例:スクワット16kg×12×3、トレッドミル6km/h 傾斜3% 30分 心拍145',meal:'例:鶏むね200g、ご飯、サラダ / タンパク質 約110g'};
let tab='train',db=null,uid=null,user=null,unsubL=null,unsubC=null,mem=[];
const $=id=>document.getElementById(id);
const fmt=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

function setTab(t){
  tab=t;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('logCard').hidden=t==='comm';$('commCard').hidden=t!=='comm';
  if(t!=='comm'){
    $('cat').innerHTML='';CATS[t].forEach(c=>{const o=document.createElement('option');o.textContent=c;$('cat').appendChild(o)});
    $('txt').placeholder=HINT[t];
    $('logNote').textContent=db?'この記録はあなただけが見られます。':'この環境ではこの端末のみに保存されます。';
    renderLog();
  }
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

function item(host,o,canDel,onDel,who){
  const e=document.createElement('div');e.className='item';
  const m=document.createElement('div');m.className='meta';
  m.textContent=fmt(o.ts)+(o.cat?' ・ '+o.cat:'')+(who?' ・ '+who:'');
  if(canDel){const x=document.createElement('button');x.className='del';x.textContent='削除';x.onclick=onDel;m.appendChild(x)}
  const p=document.createElement('pre');p.textContent=o.text;
  e.appendChild(m);e.appendChild(p);
  if(o.link&&/^https?:\/\//.test(o.link)){const a=document.createElement('a');a.href=o.link;a.target='_blank';a.rel='noopener';a.textContent=o.link;e.appendChild(a)}
  host.appendChild(e);
}

let logDocs=[];
function renderLog(){
  renderStamps();
  const h=$('list');h.innerHTML='';
  const rows=(db?logDocs:mem).filter(r=>r.type===tab);
  if(!rows.length){h.textContent='まだ記録がありません。';h.className='sub';return}
  h.className='';
  rows.forEach(r=>item(h,r,true,()=>delLog(r)));
}
function loadMem(){try{mem=JSON.parse(localStorage.getItem('hx')||'[]')}catch(e){mem=[]}}
function saveMem(){try{localStorage.setItem('hx',JSON.stringify(mem))}catch(e){}}
async function delLog(r){
  if(db){try{await db.doc('data/users/'+uid+'/'+r.id).delete()}catch(e){alert('削除できませんでした')}}
  else{mem=mem.filter(x=>x!==r);saveMem();renderLog()}
}
$('save').onclick=async()=>{
  const text=$('txt').value.trim();if(!text)return;
  const o={type:tab,cat:$('cat').value,text,link:$('lnk').value.trim(),ts:Date.now()};
  try{
    if(db)await db.collection('data/users/'+uid).add(o);
    else{mem.unshift(o);saveMem();renderLog()}
    $('txt').value='';$('lnk').value='';
    if(tab==='train')cheer();
  }catch(e){alert('保存できませんでした。閲覧権限をご確認ください。')}
};

async function names(ids){
  try{return user&&user.profiles?await user.profiles(ids):{}}catch(e){return {}}
}
$('cpost').onclick=async()=>{
  const text=$('ctxt').value.trim();if(!text||!db)return;
  try{await db.collection('community').add({uid,text,ts:Date.now()});$('ctxt').value=''}
  catch(e){alert('投稿できませんでした。共有時の権限(コントリビューター以上)が必要です。')}
};

const STAMPS=['🔥','💪','🏃','🏋️','⚡'];
const BADGES=[[1,'🥉','はじめの一歩'],[10,'🔥','10日達成'],[25,'💪','25日達成'],[50,'🏆','50日達成'],[100,'👑','100日達成']];
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function renderStamps(){
  const rows=(db?logDocs:mem).filter(r=>r.type==='train');
  const days=new Set(rows.map(r=>dkey(r.ts)));
  const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const mon=new Date(t0);mon.setDate(t0.getDate()-((t0.getDay()+6)%7));
  const g=$('grid');g.innerHTML='';let wk=0;
  for(let i=-21;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const c=document.createElement('div');c.className='cell';
    const on=days.has(dkey(d));
    if(d.getTime()===t0.getTime())c.classList.add('today');
    if(d>t0)c.classList.add('fut');
    if(on){c.classList.add('on');c.textContent=STAMPS[(d.getDate()+d.getMonth())%STAMPS.length];if(i>=0)wk++}
    else c.textContent=d.getDate();
    g.appendChild(c);
  }
  $('wk').textContent=wk+'/3';$('tot').textContent=days.size;
  $('smsg').textContent=wk>=3?'🎉 今週の目標達成!最高です!':'今週あと'+(3-wk)+'回でコンプリート!';
  const b=$('badges');b.innerHTML='';
  BADGES.forEach(x=>{const e=document.createElement('div');e.className='bd'+(days.size>=x[0]?'':' lock');
    const i=document.createElement('i');i.textContent=x[1];e.appendChild(i);e.appendChild(document.createTextNode(x[2]));b.appendChild(e)});
}
function cheer(){
  const t=document.createElement('div');t.className='toast';t.textContent='スタンプゲット! 🎉';document.body.appendChild(t);
  const em=['🎉','🔥','💪','⭐','🏆'];
  for(let i=0;i<16;i++){const s=document.createElement('span');s.className='cf';s.textContent=em[i%5];
    s.style.left=Math.random()*92+'%';s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}
  setTimeout(()=>t.remove(),1900);
}

(async()=>{
  loadMem();
  try{
    db=await claude.use('db');user=await claude.use('user');
    if(db&&user)uid=await user.id();else db=null;
  }catch(e){db=null}
  if(db&&uid){
    db.collection('data/users/'+uid).orderBy('ts','desc').limit(100).onSnapshot(s=>{
      logDocs=s.docs.map(d=>Object.assign({id:d.id},d.data()));renderLog();
    },()=>{});
    db.collection('community').orderBy('ts','desc').limit(50).onSnapshot(async s=>{
      const rows=s.docs.map(d=>Object.assign({id:d.id},d.data()));
      const ps=await names([...new Set(rows.map(r=>r.uid))]);
      const h=$('clist');h.innerHTML='';
      if(!rows.length){h.textContent='まだ投稿がありません。最初の投稿をしてみましょう。';h.className='sub';return}
      h.className='';
      rows.forEach(r=>item(h,r,r.uid===uid,()=>db.doc('community/'+r.id).delete().catch(()=>{}),(ps[r.uid]&&ps[r.uid].name)||'メンバー'));
    },()=>{});
  }else{db=null;$('cpost').hidden=true;$('ctxt').hidden=true;$('cnone').hidden=false}
  setTab('train');
})();
</script>
